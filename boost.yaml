blueprint:
  name: FRITZ! Heizung - einmaliger Boost
  description: >
    Startet den Boost eines ausgewählten FRITZ!-Thermostats zur Zeit eines
    ausgewählten Datum-/Uhrzeit-Helfers und beendet ihn nach der gewählten Dauer.
  domain: automation
  input:
    thermostat:
      name: Thermostat
      description: Welcher FRITZ!-Heizkörperregler soll geboostet werden?
      selector:
        target:
          entity:
            - domain: climate

    start_datetime:
      name: Startzeit
      description: Wähle deinen Helfer „Datum und Uhrzeit“
      selector:
        entity:
          domain: input_datetime

    boost_minutes:
      name: Boost-Dauer in Minuten
      description: Nach wie vielen Minuten soll Home Assistant den Boost beenden?
      default: 15
      selector:
        number:
          min: 5
          max: 240
          step: 5
          mode: box

mode: single

triggers:
  - trigger: time
    at: !input start_datetime

conditions:
  - condition: template
    value_template: >-
      {{ (states(!input start_datetime) | as_datetime).date() == now().date() }}

actions:
  - action: climate.set_preset_mode
    target: !input thermostat
    data:
      preset_mode: boost

  - delay:
      minutes: !input boost_minutes

  - action: climate.set_preset_mode
    target: !input thermostat
    data:
      preset_mode: none
