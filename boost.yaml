blueprint:
  name: FRITZ! Heizung - einmaliger Boost
  description: >
    Startet den Boost eines ausgewählten FRITZ!-Thermostats zu einem
    gewählten Datum und einer Uhrzeit und beendet ihn nach der gewählten Dauer.
  domain: automation
  input:
    thermostat:
      name: Thermostat
      description: Welcher FRITZ!-Heizkörperregler soll geboostet werden?
      selector:
        target:
          entity:
            - domain: climate

    start_datetime:
      name: Startdatum und Startzeit
      description: Wann soll der Boost beginnen?
      selector:
        datetime:

    boost_minutes:
      name: Boost-Dauer in Minuten
      description: Nach wie vielen Minuten soll Home Assistant den Boost beenden?
      default: 15
      selector:
        number:
          min: 5
          max: 240
          step: 5
          mode: box

mode: single

triggers:
  - trigger: time
    at: !input start_datetime

conditions: []

actions:
  - action: climate.set_preset_mode
    target: !input thermostat
    data:
      preset_mode: boost

  - delay:
      minutes: !input boost_minutes

  - action: climate.set_preset_mode
    target: !input thermostat
    data:
      preset_mode: none
